spring.application.name=CricLively
spring.config.import=optional:file:.env[.properties],optional:file:Backend/CricLively/.env[.properties],optional:classpath:application-local.properties

spring.mongodb.uri=mongodb://localhost:27017/CricLively
spring.servlet.multipart.max-file-size= 10MB
spring.servlet.multipart.max-request-size= 20MB


# MongoDB logging (very useful for queries)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.mongodb.driver=INFO

# Address of the React app (used for CORS). Change it when you deploy.
app.cors.allowed-origin=http://localhost:5173
app.frontend-url=http://localhost:5173

# Email verification SMTP configuration.
# Set MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD env vars (or fill values here) to send verification emails.
# Example for Gmail SMTP: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=you@gmail.com, MAIL_PASSWORD=<16-char-app-password>
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}
app.email.verification.ttl-minutes=5
